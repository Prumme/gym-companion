name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.8-alpine
        env:
          POSTGRES_USER: gym
          POSTGRES_PASSWORD: gym
          POSTGRES_DB: gym_companion
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U gym -d gym_companion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 3000
      PUBLIC_APP_URL: http://localhost:5173
      API_BASE_URL: http://localhost:3000
      DATABASE_URL: postgresql://gym:gym@localhost:5433/gym_companion?schema=public
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      LOG_LEVEL: error
      JWT_ACCESS_SECRET: test-jwt-access-secret-at-least-32-chars!!
      COOKIE_SECRET: test-cookie-secret-at-least-32-characters
      EMAIL_PROVIDER: none
      VITE_API_BASE_URL: http://localhost:3000
      VITE_PUBLIC_APP_URL: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma migrate
        run: pnpm --filter @gym-companion/api prisma:deploy

      - name: Shell syntax (prod scripts)
        run: |
          bash -n scripts/prod/backup-postgres.sh
          bash -n scripts/prod/restore-postgres.sh
          bash -n scripts/prod/prune-backups.sh
          bash -n scripts/prod/deploy.sh

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
