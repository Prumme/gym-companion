name: Deploy production

# Déploiement manuel uniquement — ne pas déclencher sur push.
# Déploie EXACTEMENT github.sha (commit/branche/tag sélectionné dans l’UI).
on:
  workflow_dispatch:

concurrency:
  group: gym-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy production
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Prod
      url: https://gym.prumme.dev

    steps:
      - name: Validate deploy SHA
        run: |
          set -Eeuo pipefail
          SHA='${{ github.sha }}'
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Refusing unexpected github.sha format" >&2
            exit 1
          fi
          echo "Deploy target: ${SHA}"
          echo "App URL: https://gym.prumme.dev"
          echo "API URL: https://api.gym.prumme.dev"

      - name: Configure SSH
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: SSH deploy on VPS
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
        run: |
          set -Eeuo pipefail
          SHA='${{ github.sha }}'
          PORT="${PROD_SSH_PORT:-22}"
          # Quote-safe : SHA déjà validé hex 40 chars.
          ssh -p "$PORT" \
            -i ~/.ssh/id_deploy \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            "${PROD_SSH_USER}@${PROD_SSH_HOST}" \
            "/opt/gym-companion/scripts/prod/deploy.sh ${SHA}"
